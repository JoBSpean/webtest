name: catpuzzle-build-110
on:
  push:
    branches: [catpuzzle-build-110]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: cd catbuild && gradle :app:assembleDebug --stacktrace
      - run: cp catbuild/app/build/outputs/apk/debug/app-debug.apk CatPuzzleAssistant-1.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CatPuzzleAssistant-1.1.0
          path: CatPuzzleAssistant-1.1.0.apk
          if-no-files-found: error
